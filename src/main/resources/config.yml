# ---- Profile ----
profile:
  menu-title: "&8Profilo di %player%"

# ---- KeyAll ----
keyall:
  valid-types:
    - common
    - rare
    - epic
    - legendary
  broadcast: "&a&l[KeyAll] &eTutti hanno ricevuto &b%amount%x %type% Key&e!"
  received: "&7Hai ricevuto &b%amount%x %type% Key&7!"

# ---- Media Menu ----
media:
  menu-title: "&8&lMedia Menu"
  slots:
    0:
      material: DIAMOND
      name: "&bRequisiti"
      lore:
        - "&71. 1000 Iscritti"
        - "&72. Canale attivo"
      permission: ""
    4:
      material: EMERALD
      name: "&aBenefici"
      lore:
        - "&7Fly nel spawn"
        - "&7Kit esclusivo"
      permission: ""

# ---- Info Menu ----
info:
  menu-title: "&8&lServer Info"
  server-name: "&b&lMy SMP Server"
  owner: "lorenzz"
  discord: "discord.gg/example"
  website: "www.example.com"
  slots:
    0:
      material: BEACON
      name: "&bServer"
      lore:
        - "&7Nome: &b%server-name%"
        - "&7Owner: &b%owner%"
    4:
      material: BOOK
      name: "&eSocial"
      lore:
        - "&7Discord: &9%discord%"
        - "&7Website: &a%website%"

# ---- Rules ----
rules:
  menu-title: "&8&lRegole del Server"
  force-accept-on-first-join: true
  auto-open-on-join: true
  kick-delay-seconds: 60
  accept-message: "&aHai accettato le regole!"
  deny-message: "&cDevi accettare le regole per giocare!"
  rules-list:
    - "&c1. &7Niente hack o cheat."
    - "&c2. &7Rispetta tutti i giocatori."
    - "&c3. &7No spam o pubblicità."
    - "&c4. &7No grief nelle zone protette."
    - "&c5. &7Segui le indicazioni dello staff."
    - "&c6. &7No exploit o bug abuse."
    - "&c7. &7Divertiti!"

# ---- Amethyst Tools ----
tools:
  durability-uses: 500
  tools-list:
    amethyst_sword:
      material: DIAMOND_SWORD
      name: "&d&lAmethyst Sword"
      lore:
        - "&7Spada in ametista"
        - "&7Usi rimanenti: &d%uses%"
      enchantments:
        SHARPNESS: 6
      attributes:
        GENERIC_ATTACK_DAMAGE: 12.0
    amethyst_pickaxe:
      material: DIAMOND_PICKAXE
      name: "&d&lAmethyst Pickaxe"
      lore:
        - "&7Piccone in ametista"
        - "&7Usi rimanenti: &d%uses%"
      enchantments:
        EFFICIENCY: 7
        FORTUNE: 4
      attributes:
        GENERIC_ATTACK_SPEED: 1.5

# ---- Stats Wipe ----
statswipe:
  log-file: "statswipe-log.txt"
  confirm-title: "&c&lSei sicuro?"
  messages:
    wiped: "&c&lTutte le statistiche sono state resettate!"
    cancelled: "&7Operazione annullata."

# ---- Lunar Client ----
lunar:
  server-name: "My SMP"
  discord-app-id: ""

# ---- Settings ----
settings:
  defaults:
    chat: true
    private-messages: true
    tpa-requests: true
    bounty-notifications: true
    team-notifications: true
    particles: true
    kill-messages: true
    sell-notifications: true

