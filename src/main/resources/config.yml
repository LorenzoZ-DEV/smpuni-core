# ---- Profile ----
profile:
  menu-title: '&8Profile of %player%'

# ---- KeyAll ----
keyall:
  valid-types:
    - basic_key
  # Command executed from console for each player. Use %player%, %type%, %amount%
  console-command: crates key give %player% %type% %amount%
  # Auto KeyAll - automatically gives keys at a set interval
  auto-enabled: true
  auto-interval-minutes: 60
  auto-type: basic_key
  auto-amount: 1
  broadcast: '&a&l[KeyAll] &eEveryone received &b%amount%x %type% Key&e!'
  received: '&7You received &b%amount%x %type% Key&7!'

# ---- Media Menu ----
media:
  menu-title: '&8&lMedia Menu'
  slots:
    '0':
      material: DIAMOND
      name: '&bRequirements'
      lore:
        - '&71. 1000 Subscribers'
        - '&72. Active channel'
      permission: ''
    '4':
      material: EMERALD
      name: '&aBenefits'
      lore:
        - '&7Fly at spawn'
        - '&7Exclusive kit'
      permission: ''

# ---- Info Menu ----
info:
  menu-title: '&8&lServer Info'
  server-name: '&b&lMy SMP Server'
  owner: lorenzz
  discord: discord.gg/example
  website: www.example.com
  slots:
    '0':
      material: BEACON
      name: '&bServer'
      lore:
        - '&7Name: &b%server-name%'
        - '&7Owner: &b%owner%'
    '4':
      material: BOOK
      name: '&eSocial'
      lore:
        - '&7Discord: &9%discord%'
        - '&7Website: &a%website%'

# ---- Rules ----
rules:
  menu-title: '&8&lServer Rules'
  force-accept-on-first-join: false
  auto-open-on-join: false
  kick-delay-seconds: 60
  accept-message: '&aYou have accepted the rules!'
  deny-message: '&cYou must accept the rules to play!'
  rules-list:
    - '&c1. &7No hacking or cheating.'
    - '&c2. &7Respect all players.'
    - '&c3. &7No spam or advertising.'
    - '&c4. &7No griefing in protected areas.'
    - '&c5. &7Follow staff instructions.'
    - '&c6. &7No exploits or bug abuse.'
    - '&c7. &7Have fun!'

