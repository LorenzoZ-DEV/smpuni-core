# ==========================================
#           HIRU - SMP Core Plugin
#       Configuration File (config.yml)
# ==========================================

# ---- Module Toggle ----
modules:
  clearlag: true
  economy: true
  stats: true
  shards: true
  tpa: true
  spawn: true
  afk: true
  rtp: true
  profile: true
  keyall: true
  media: true
  info: true
  rules: true
  tools: true
  lunar: true
  settings: true
  worth: true
  teams: true
  homes: true
  bounty: true
  leaderboard: true
  sell: true
  shop: true
  billford: true
  help: true
  kits: true
  announcements: true
  ad: true
  broadcast: true
  report: true
  request: true
  clearchat: true
  skilltree: true
  playtime-rewards: true
  back: true

# ---- Database ----
database:
  type: YAML  # YAML or SQLITE
  sqlite:
    file: hiru.db

# ---- Messages ----
messages:
  prefix: "&8[&bHiru&8] "
  no-permission: "&cNon hai il permesso!"
  player-only: "&cSolo i giocatori possono usare questo comando!"
  reload-success: "&aConfigurazione ricaricata con successo!"
  player-not-found: "&cGiocatore non trovato!"

# ---- Economy ----
economy:
  starting-balance: 1000.0
  currency-name: "Coins"
  currency-symbol: "$"
  baltop-size: 10
  messages:
    balance: "&7Il tuo saldo: &a%symbol%%amount%"
    balance-other: "&7Saldo di &b%player%&7: &a%symbol%%amount%"
    pay-sent: "&7Hai inviato &a%symbol%%amount% &7a &b%player%&7."
    pay-received: "&7Hai ricevuto &a%symbol%%amount% &7da &b%player%&7."
    pay-insufficient: "&cSaldo insufficiente!"
    pay-invalid-amount: "&cImporto non valido!"
    eco-give: "&7Dati &a%symbol%%amount% &7a &b%player%&7."
    eco-take: "&7Rimossi &a%symbol%%amount% &7da &b%player%&7."
    eco-set: "&7Saldo di &b%player% &7impostato a &a%symbol%%amount%&7."
    baltop-header: "&8&m----------&8[ &bBaltop &8]&8&m----------"
    baltop-entry: "&7#%position% &b%player% &7- &a%symbol%%amount%"
    baltop-footer: "&8&m---------------------------------"

# ---- ClearLag ----
clearlag:
  auto-clear: true
  interval-minutes: 10
  countdown-seconds: 30
  remove-animals: false
  remove-monsters: true
  remove-items: true
  remove-experience: false
  entity-whitelist:
    - VILLAGER
    - HORSE
    - WOLF
    - CAT
    - PARROT
    - ARMOR_STAND
    - ITEM_FRAME
  messages:
    warning: "&c&l[ClearLag] &ePulizia entità tra &c%seconds% &esecondi!"
    cleared: "&c&l[ClearLag] &aRimosse &e%amount% &aentità!"

# ---- Shards ----
shards:
  currency-name: "Shards"
  earn:
    mob-kill: 5
    mining:
      DIAMOND_ORE: 10
      EMERALD_ORE: 15
      GOLD_ORE: 3
      IRON_ORE: 2
      ANCIENT_DEBRIS: 25
    farming:
      WHEAT: 1
      CARROTS: 1
      POTATOES: 1
      BEETROOTS: 1
      NETHER_WART: 2
  messages:
    balance: "&7I tuoi Shards: &d%amount%"
    earned: "&7Hai guadagnato &d%amount% Shards&7!"

# ---- TPA ----
tpa:
  timeout-seconds: 60
  cooldown-seconds: 30
  teleport-delay-seconds: 3
  messages:
    sent: "&7Richiesta TPA inviata a &b%player%&7."
    received: "&7&b%player% &7vuole teletrasportarsi da te! &a/tpaccept &7o &c/tpdeny"
    accepted: "&7Richiesta TPA accettata!"
    denied: "&7Richiesta TPA rifiutata."
    expired: "&7La richiesta TPA è scaduta."
    cooldown: "&cDevi aspettare &e%seconds% &csecondi prima di inviare un'altra richiesta."
    no-request: "&cNon hai richieste TPA pendenti."
    teleporting: "&7Teletrasporto tra &e{seconds} &7secondi... Non muoverti!"
    moved: "&cTi sei mosso! Teletrasporto annullato."
    self: "&cNon puoi inviare una TPA a te stesso!"
    teleported: "&7Teletrasportato da &b%player%&7!"
    actionbar-countdown: "&e⏳ Teleporting in &c{seconds}s&e..."
    actionbar-success: "&a✔ Teleported to &b{player}"

# ---- Spawn ----
spawn:
  teleport-on-join: true
  teleport-delay-seconds: 3
  spawns: {}
  messages:
    teleported: "&7Teletrasportato allo spawn &b%name%&7!"
    set: "&7Spawn &b%name% &7impostato!"
    not-set: "&cNessuno spawn impostato!"
    menu-title: "&8Spawn Menu"
    teleporting: "&7Teletrasporto tra &e{seconds} &7secondi... Non muoverti!"
    moved: "&cTi sei mosso! Teletrasporto annullato."
    actionbar-countdown: "&e⏳ Teleporting in &c{seconds}s&e..."
    actionbar-success: "&a✔ Teleported to spawn &b{name}"

# ---- AFK ----
afk:
  kick-enabled: true
  kick-after-minutes: 30
  kick-message: "&cSei stato kickato per inattività!"
  exempt-permission: "hiru.afk.exempt"
  messages:
    now-afk: "&7%player% &7è ora &eAFK&7."
    no-longer-afk: "&7%player% &7non è più &eAFK&7."
  zones:
    spawn-afk:
      world: "world"
      min-x: -50
      min-y: 0
      min-z: -50
      max-x: 50
      max-y: 256
      max-z: 50

# ---- RTP ----
rtp:
  max-attempts: 20
  cooldown-seconds: 300
  teleport-delay-seconds: 5
  unsafe-blocks:
    - LAVA
    - WATER
    - MAGMA_BLOCK
    - CACTUS
    - SWEET_BERRY_BUSH
    - FIRE
    - SOUL_FIRE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - WITHER_ROSE
    - POWDER_SNOW
  worlds:
    overworld:
      world-name: "world"
      min-radius: 250
      max-radius: 5000
      min-y: 64
      max-y: 256
      enabled: true
    nether:
      world-name: "world_nether"
      min-radius: 100
      max-radius: 500
      min-y: 32
      max-y: 100
      enabled: true
    end:
      world-name: "world_the_end"
