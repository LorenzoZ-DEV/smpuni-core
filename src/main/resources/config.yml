# ---- Teams ----
teams:
  max-members: 10
  name-max-length: 16
  home-cooldown-seconds: 60
  messages:
    created: "&#55FF55Team created!"
    disbanded: "&#FF4444Team disbanded."
    invited: "&#FFD700Invite sent!"
    joined: "&#55FF55Joined the team!"
    left: "&#8C8C8CYou left the team."
    kicked: "&#FF4444You were kicked."

# ---- Homes ----
homes:
  warmup-seconds: 3
  cooldown-seconds: 30
  limits:
    default: 1
    vip: 3
    mvp: 5
    admin: 10
  messages:
    set: "&#55FF55Home set!"
    deleted: "&#55FF55Home deleted."
    teleported: "&#55FF55Teleported to home!"
    limit-reached: "&#FF4444Home limit reached!"

# ---- Bounty ----
bounty:
  min-amount: 50
  tax-percent: 10
  messages:
    placed: "&#55FF55Bounty placed!"
    claimed: "&#55FF55Bounty claimed!"
    broadcast-placed: "&#FF4444&l⚠ BOUNTY placed on %target%!"
    broadcast-claimed: "&#55FF55&l⚔ BOUNTY CLAIMED on %target%!"

# ---- Leaderboard ----
leaderboard:
  top-size: 10
  refresh-seconds: 300

# ---- Sell ----
sell:
  messages:
    sold: "&#55FF55Items sold!"
    no-items: "&#8C8C8CNo sellable items found."

# ---- Shop ----
shop:
  messages:
    bought: "&#55FF55Item purchased!"
    sold: "&#55FF55Item sold!"
    not-enough: "&#FF4444Not enough funds!"

# ---- Billford ----
billford:
  rotation-hours: 6
  active-trades: 3
  messages:
    new-trades: "&#FFD700&l⚡ BILLFORD | New trades available!"

# ---- Kits ----
kits:
  auto-give-starter-on-first-join: true
  starter-kit-id: "starter"
  gui:
    title: "&#FFD700&l⚡ Kits"
  messages:
    claimed: "&#55FF55You claimed the %kit% &#55FF55kit!"
    not-found: "&#FF4444Kit &f%kit% &#FF4444not found!"
    no-permission: "&#FF4444You don't have permission to claim this kit!"
    already-claimed: "&#FF4444You have already claimed this one-time kit!"
    cooldown: "&#FF4444Kit on cooldown! &f%time% &#FF4444remaining."
    auto-starter: "&#55FF55You received the &#FFD700Starter Kit&#55FF55! Use &f/kit &#55FF55to view all kits."

# ---- Ad System ----
ad:
  cooldown-seconds: 300
  messages-list:
    - "Join SmpUni on Minehut! Type /join SmpUni to play now!"
    - "Looking for a great SMP? SmpUni is waiting for you — /join SmpUni"
    - "SmpUni — The best SMP on Minehut. Come join us! /join SmpUni"
    - "Play with us on SmpUni! Connect via Minehut: /join SmpUni"
    - "SmpUni is LIVE on Minehut! Don't miss out — /join SmpUni"
    - "The ultimate SMP experience is on SmpUni — /join SmpUni"
    - "Your next adventure starts here! /join SmpUni on Minehut"
    - "Escape the ordinary. SmpUni on Minehut is LIVE! /join SmpUni"
    - "Best SMP on Minehut — SmpUni is waiting for YOU! /join SmpUni"
    - "Join the community! SmpUni on Minehut — /join SmpUni"
  messages:
    cooldown: "&cYou can use /ad again in &e%seconds% &cseconds."
    confirmed: "&aThanks for advertising SmpUni! &7Next use in &e%minutes% minutes&7."

