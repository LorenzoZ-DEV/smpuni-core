# ---- Back (Death Teleport) ----
back:
  cooldown-seconds: 30

# ---- Combat System ----
combat:
  # How long the combat tag lasts (seconds)
  tag-duration-seconds: 15
  # Kill and drop items if a player logs out while in combat
  punish-logout: true
  drop-items-on-logout: true
  # Block commands during combat
  block-commands: true
  # Block ender pearl usage during combat
  block-ender-pearl: false
  # Block chorus fruit during combat
  block-chorus-fruit: true
  # Block any teleportation during combat
  block-teleport: true
  # Disable flying when entering combat
  block-flying: true
  # Commands blocked while in combat (checked with startsWith)
  blocked-commands:
    - /home
    - /sethome
    - /tpa
    - /tpaccept
    - /tpdeny
    - /spawn
    - /rtp
    - /back
    - /warp
    - /tp
    - /fly
    - /afk
    - /logout
    - /hub
    - /leave
    - /kit
    - /sell
    - /shop
    - /skills
    - /rewards
  # Commands always allowed in combat (whitelist override)
  allowed-commands:
    - /msg
    - /r
    - /reply
    - /combattimer
    - /ct
    - /report
  messages:
    tagged: '&#FF4444⚔ You are now in combat! &7Do not log out.'
    expired: '&#55FF55✔ You are no longer in combat.'
    fly-disabled: '&#FF4444Flight disabled — you are in combat!'
    command-blocked: '&#FF4444You cannot use that command while in combat!'
    ender-pearl-blocked: '&#FF4444You cannot use ender pearls while in combat!'
    chorus-blocked: '&#FF4444You cannot eat chorus fruit while in combat!'
    teleport-blocked: '&#FF4444You cannot teleport while in combat!'
    combat-log-broadcast: '&#FF4444⚠ &#FF6B6B%player% &#8C8C8Clogged out while in
      combat with &#55FF55%attacker%&#8C8C8C!'
    actionbar: '&#FF4444⚔ COMBAT &#8C8C8C» %bar% &#FF6B6B%seconds%s'
# ---- Warp System ----
warp:
  teleport-delay-seconds: 3
  gui-title: '&8Warps'
  messages:
    teleported: '&7Teleported to warp &b%name%&7!'
    set: '&7Warp &b%name% &7has been set!'
    deleted: '&7Warp &b%name% &7has been deleted!'
    not-found: '&cWarp &e%name% &cnot found!'
    no-warps: '&cNo warps available!'
    teleporting: '&7Teleporting in &e{seconds} &7seconds... Don''t move!'
    moved: '&cYou moved! Teleport cancelled.'
    actionbar-countdown: '&e⏳ Teleporting in &c{seconds}s&e...'
    actionbar-success: '&a✔ Teleported to warp &b{name}'

# ---- Duel System ----
duel:
  challenge-timeout-seconds: 30
  countdown-seconds: 5
  block-commands: true
  messages:
    self: '&cYou can''t duel yourself!'
    challenge-sent: '&7Duel challenge sent to &b%player%&7!'
