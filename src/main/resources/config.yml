      &7or &c/dueldeny'
    accepted: '&a⚔ Duel accepted! Prepare to fight!'
    denied: '&7Duel challenge denied.'
    denied-by-target: '&b%player% &cdenied your duel challenge.'
    no-challenge: '&cYou have no pending duel challenges.'
    expired: '&7The duel challenge has expired.'
    already-in-duel: '&cYou are already in a duel!'
    target-in-duel: '&cThat player is already in a duel!'
    arena-not-set: '&cThe duel arena has not been configured yet!'
    starting: '&e⚔ Duel starting in &c{seconds} &eseconds!'
    fight: '&c&l⚔ FIGHT!'
    won: '&a&l⚔ You won the duel against &b%player%&a!'
    lost: '&cYou lost the duel against &b%player%&c!'
    broadcast-end: '&e⚔ &b%winner% &edefeated &b%loser% &ein a duel!'
    disconnect: '&c⚠ &b%player% &cdisconnected during a duel!'
    command-blocked: '&cYou cannot use commands during a duel!'
    pos1-set: '&aArena position 1 set!'
