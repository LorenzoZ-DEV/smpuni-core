# ==========================================
#           HIRU - SMP Core Plugin
#       Configuration File (config.yml)
# ==========================================

# ---- Module Toggle ----
modules:
  clearlag: true
  economy: true
  stats: true
  shards: true
  tpa: true
  spawn: true
  afk: true
  rtp: true
  profile: true
  keyall: true
  media: true
  info: true
  rules: true
  tools: true
  lunar: true
  settings: true
  worth: true
  teams: true
  homes: true
  bounty: true
  leaderboard: true
  sell: true
  shop: true
  billford: true
  help: true
  kits: true
  announcements: false
  ad: true
  broadcast: true
  report: true
  request: true
  clearchat: true
  skilltree: true
  playtime-rewards: true
  back: true
  combat: true
  warp: true
  duel: true
  changelog: true
  chatgames: true

# ---- Database ----
database:
  type: YAML # YAML or SQLITE
  sqlite:
    file: hiru.db

# ---- Messages ----
messages:
  prefix: '&8[&a❇&8] '
  no-permission: '&cYou don''t have permission!'
  player-only: '&cOnly players can use this command!'
  reload-success: '&aConfiguration reloaded successfully!'
  player-not-found: '&cPlayer not found!'

# ---- Sounds ----
sounds:
  teleport: ENTITY_ENDERMAN_TELEPORT
  teleport-countdown: BLOCK_NOTE_BLOCK_PLING
  error: ENTITY_VILLAGER_NO
  success: ENTITY_EXPERIENCE_ORB_PICKUP
  duel-start: ENTITY_ENDER_DRAGON_GROWL
  duel-win: UI_TOAST_CHALLENGE_COMPLETE
  enderchest-open: BLOCK_ENDER_CHEST_OPEN
  kit-claim: ENTITY_PLAYER_LEVELUP
  rtp: ENTITY_ENDERMAN_TELEPORT
  chatgame-start: BLOCK_NOTE_BLOCK_BELL
  chatgame-win: ENTITY_PLAYER_LEVELUP

# ---- Economy ----
economy:
  starting-balance: 1000.0
  currency-name: Coins
  currency-symbol: $
  baltop-size: 10
  messages:
    balance: '&7Your balance: &a%symbol%%amount%'
    balance-other: '&7Balance of &b%player%&7: &a%symbol%%amount%'
    pay-sent: '&7You sent &a%symbol%%amount% &7to &b%player%&7.'
    pay-received: '&7You received &a%symbol%%amount% &7from &b%player%&7.'
    pay-insufficient: '&cInsufficient balance!'
    pay-invalid-amount: '&cInvalid amount!'
    eco-give: '&7Given &a%symbol%%amount% &7to &b%player%&7.'
    eco-take: '&7Removed &a%symbol%%amount% &7from &b%player%&7.'
    eco-set: '&7Balance of &b%player% &7set to &a%symbol%%amount%&7.'
    baltop-header: '&8&m----------&8[ &bBaltop &8]&8&m----------'
    baltop-entry: '&7#%position% &b%player% &7- &a%symbol%%amount%'
    baltop-footer: '&8&m---------------------------------'

# ---- ClearLag ----
clearlag:
  auto-clear: true
  interval-minutes: 10
  countdown-seconds: 30
  remove-animals: false
  remove-monsters: false
  remove-items: true
  remove-experience: false
  entity-whitelist:
    - VILLAGER
    - HORSE
    - WOLF
    - CAT
    - PARROT
    - ARMOR_STAND
    - ITEM_FRAME
  messages:
    warning: '&c[ClearLag] &fEntity cleanup in &c%seconds% &fseconds!'
    cleared: '&c[ClearLag] &fRemoved &c%amount% &fentities!'

# ---- Shards ----
shards:
  currency-name: Shards
  earn:
    mob-kill: 2
    mining:
      DIAMOND_ORE: 5
      EMERALD_ORE: 4
      GOLD_ORE: 3
      IRON_ORE: 2
      ANCIENT_DEBRIS: 10
    farming:
      WHEAT: 1
      CARROTS: 1
      POTATOES: 1
      BEETROOTS: 1
      NETHER_WART: 2
  messages:
    balance: '&7Your Shards: &d%amount%'
    earned: '&7You earned &d%amount% Shards&7!'

# ---- TPA ----
tpa:
  timeout-seconds: 60
  cooldown-seconds: 30
  teleport-delay-seconds: 3
  messages:
    sent: '&7TPA request sent to &b%player%&7.'
    received: '&7&b%player% &7wants to teleport to you! &a/tpaccept &7or &c/tpdeny'
    accepted: '&7TPA request accepted!'
    denied: '&7TPA request denied.'
    expired: '&7The TPA request has expired.'
    cooldown: '&cYou must wait &e%seconds% &cseconds before sending another request.'
    no-request: '&cYou have no pending TPA requests.'
    teleporting: '&7Teleporting in &e{seconds} &7seconds... Don''t move!'
    moved: '&cYou moved! Teleport cancelled.'
    self: '&cYou can''t send a TPA to yourself!'
    teleported: '&7Teleported to &b%player%&7!'
    actionbar-countdown: '&e⏳ Teleporting in &c{seconds}s&e...'
    actionbar-success: '&a✔ Teleported to &b{player}'
    tpahere-sent: '&7TPAHere request sent to &b%player%&7.'
    tpahere-received: '&7&b%player% &7wants you to teleport to them! &a/tpaccept &7or
      &c/tpdeny'
    tpahere-accepted: '&b%player% &7teleported to you!'

# ---- Spawn ----
spawn:
  teleport-on-join: true
  teleport-delay-seconds: 3
  spawns: {}
  messages:
    teleported: '&7Teleported to spawn &b%name%&7!'
    set: '&7Spawn &b%name% &7has been set!'
    not-set: '&cNo spawn has been set!'
    menu-title: '&8Spawn Menu'
    teleporting: '&7Teleporting in &e{seconds} &7seconds... Don''t move!'
    moved: '&cYou moved! Teleport cancelled.'
    actionbar-countdown: '&e⏳ Teleporting in &c{seconds}s&e...'
    actionbar-success: '&a✔ Teleported to spawn &b{name}'

# ---- AFK ----
afk:
  kick-enabled: true
  kick-after-minutes: 30
  kick-message: '&cYou have been kicked for inactivity!'
  exempt-permission: hiru.afk.exempt
  # AFK Zone reward settings - gives shards to players standing in AFK zones
  zone-reward-interval-seconds: 60
  zone-reward-shards: 1
  messages:
    now-afk: '&7%player% &7is now &eAFK&7.'
    no-longer-afk: '&7%player% &7is no longer &eAFK&7.'
    zone-reward: '&7You received &d%amount% Shards &7for staying in the AFK Zone!'
  # AFK zones are now stored in afkzones.yml (auto-created, with backup system)

# ---- RTP ----
rtp:
  max-attempts: 20
  cooldown-seconds: 300
  teleport-delay-seconds: 5
  unsafe-blocks:
    - LAVA
    - WATER
    - MAGMA_BLOCK
    - CACTUS
    - SWEET_BERRY_BUSH
    - FIRE
    - SOUL_FIRE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - WITHER_ROSE
    - POWDER_SNOW
  worlds:
    overworld:
      world-name: world
      min-radius: 250
      max-radius: 5000
      min-y: 64
      max-y: 256
      enabled: true
    nether:
      world-name: world_nether
      min-radius: 100
      max-radius: 500
      min-y: 32
      max-y: 100
      enabled: true
    end:
      world-name: world_the_end
      min-radius: 500
      max-radius: 2000
      min-y: 50
      max-y: 100
      enabled: false
  messages:
    teleporting: '&7Teleporting in &e{seconds} &7seconds... Don''t move!'
    teleported: '&7Teleported to &bX: {x} Z: {z} &7in world &b{world}&7!'
