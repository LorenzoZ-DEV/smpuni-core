name: Solum
version: '${version}'
main: dev.lorenzz.solum.Solum
api-version: '1.20'
authors: [Lorenzzzzzz]
website: "https://lorenzzzz.xyz"
depend: [Vault]
softdepend: [PlaceholderAPI, LuckPerms]
description: SMP Core Plugin

permissions:
  solum.admin:
    description: Full admin access
    default: op
  solum.auctionhouse.use:
    description: Use the Auction House
    default: true
  solum.auctionhouse.sell:
    description: List items on the Auction House
    default: true
  solum.auctionhouse.unlimited:
    description: Bypass max listings limit
    default: op
  solum.auctionhouse.admin:
    description: Cancel any AH listing
    default: op
  solum.media:
    description: Media rank access
    default: false
  solum.tpa:
    description: TPA access
    default: true
  solum.clearlag:
    description: Clearlag access
    default: op
  solum.vip:
    description: VIP access
    default: false
  solum.balance:
    description: Balance check
    default: true
  solum.pay:
    description: Pay players
    default: true
  solum.shards:
    description: Check shards
    default: true
  solum.spawn:
    description: Teleport to spawn
    default: true
  solum.profile:
    description: View profiles
    default: true
  solum.rtp:
    description: Random teleport
    default: true
  solum.afk:
    description: Toggle AFK
    default: true
  solum.rules:
    description: View rules
    default: true
  solum.info:
    description: View info
    default: true
  solum.giveamethyst:
    description: Give amethyst tools
    default: op
  solum.settings:
    description: Open settings menu
    default: true
  solum.home:
    description: Use home system
    default: true
  solum.bounty:
    description: Use bounty system
    default: true
  solum.leaderboard:
    description: View leaderboards
    default: true
  solum.sell:
    description: Sell items
    default: true
  solum.shop:
    description: Use shop
    default: true
  solum.billford:
    description: Use Billford trader
    default: true
  solum.homes.vip:
    description: VIP home limit
    default: false
  solum.homes.mvp:
    description: MVP home limit
    default: false
  solum.homes.admin:
    description: Admin home limit
    default: op
  solum.kit:
    description: Use kit system
    default: true
  solum.kit.starter:
    description: Claim the starter kit
    default: true
  solum.announce:
    description: Manage announcements
    default: op
  solum.ad:
    description: Use /ad command
    default: true
  solum.ad.bypass:
    description: Bypass ad cooldown
    default: op
  solum.broadcast:
    description: Send broadcast messages
    default: op
  solum.report:
    description: Report a player
    default: true
  solum.report.receive:
    description: Receive report notifications
    default: op
  solum.report.bypass:
    description: Bypass report cooldown
    default: op
  solum.request:
    description: Send a request to staff
    default: true
  solum.request.receive:
    description: Receive request notifications
    default: op
  solum.request.bypass:
    description: Bypass request cooldown
    default: op
  solum.clearchat:
    description: Clear the server chat
    default: op
  solum.skills:
    description: Access skill tree
    default: true
  solum.skills.reset:
    description: Reset skill tree
    default: true
  solum.rewards:
    description: View playtime rewards
    default: true
  solum.back:
    description: Use /back command
    default: true
  solum.back.bypasscooldown:
    description: Bypass /back cooldown
    default: op
  solum.combat.bypass:
    description: Bypass combat tag restrictions
    default: op
  solum.tpahere:
    description: TPAHere access
    default: true
  solum.warp:
    description: Use warps
    default: true
  solum.warp.bypassdelay:
    description: Bypass warp teleport delay
    default: op
  solum.duel:
    description: Use duel system
    default: true
  solum.doublejump:
    description: Use double jump at spawn
    default: true
